[build]
  command   = "npm install -g pnpm && pnpm install --no-frozen-lockfile && node scripts/sync-cleaners.mjs && pnpm --filter @workspace/my-clean-pc run build"
  publish   = "artifacts/my-clean-pc/dist/public"
  functions = "artifacts/my-clean-pc/netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  PORT         = "19705"
  BASE_PATH    = "/"

# Required env vars (Netlify → Site configuration → Environment variables):
#   RESEND_API_KEY  — free key from resend.com
#   APP_URL         — your Netlify site URL, e.g. https://my-clean-pc.netlify.app

[[redirects]]
  from   = "/.netlify/functions/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200
