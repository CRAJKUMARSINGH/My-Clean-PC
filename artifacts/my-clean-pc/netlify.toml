[build]
  base    = "artifacts/my-clean-pc"
  command = "npm ci --ignore-scripts && npm run build"
  publish = "dist/public"

[build.environment]
  NODE_VERSION    = "20"
  NPM_VERSION     = "10"
  NODE_ENV        = "production"
  PORT            = "19705"
  BASE_PATH       = "/"
  NETLIFY_USE_YARN = "false"

[functions]
  directory = "netlify/functions"

[[redirects]]
  from   = "/api/*"
  to     = "/.netlify/functions/:splat"
  status = 200

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200